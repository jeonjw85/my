services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: my-app:latest
        restart: unless-stopped
        ports:
            - "${APP_PORT:-3000}:3000"
        env_file:
            - .env
            - .env.local
        environment:
            NODE_ENV: production
            DATABASE_URL: file:/app/data/dev.db
        volumes:
            - uploads:/app/uploads
            - db-data:/app/data
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

volumes:
    uploads:
    db-data:
